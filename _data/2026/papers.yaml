Day 1 (September 1st):
  - title: "Self-Control Techniques of Famous Novelists"
    author: "Irving Wallace"
    PDF: "sWallace_writers_habits_elf-control-techniques-famous-novelists-jaba-1977.pdf"
    comment: "On pg. 2 of this interesting article on the habits of writers entitled “Self-Control Techniques of Famous Novelists” by Irving Wallace, he shows us some of the “appliances” used by writers such as Trollope, Balzac, Hemingway, Victor Hugo and others.  Note the systematic tables and graphs used by Wallace himself during the writing of some of his famous novels."

  - title: "The Eye of Reason: Darwin's Development during the Beagle Voyage"
    author: "Howard E. Gruber and Valmai Gruber"
    journal: "The University of Chicago Press and The History of Science Society"
    comment: "It is wonderful and amazing to imagine the 22 year old Darwin off to explore the world.  While on his 249 week voyage, he took copious notes and this article tells the story of Darwin’s many notebooks.   Our hope is that over your roughly 250 weeks at Caltech that you too will practice the fine art of private notebook keeping, trusting your instincts for interesting questions and strategies to answer them."
    year: "2011"
    PDF: "Gruber_Eye_of_reason.pdf"

